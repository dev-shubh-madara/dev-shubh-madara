<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84">
<defs><linearGradient id="ink" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="rule" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".9"/><stop offset=".6" stop-color="#a78bfa" stop-opacity=".5"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient>
<clipPath id="t"><text x="92" y="50" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="38" font-weight="900" letter-spacing="5">TECH STACK</text></clipPath>
</defs>
<g transform="translate(18,10)">
<polygon points="31,0 58,16 58,48 31,64 4,48 4,16" fill="#0d0a24" stroke="url(#ink)" stroke-width="2.2" filter="url(#glow)"><animate attributeName="stroke-opacity" values=".6;1;.6" dur="3s" repeatCount="indefinite"/></polygon>
<polygon points="31,10 49,20 49,44 31,54 13,44 13,20" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-dasharray="4 5"><animateTransform attributeName="transform" type="rotate" from="0 31 32" to="360 31 32" dur="14s" repeatCount="indefinite"/></polygon>
<text x="31" y="39" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="19" font-weight="700" fill="#e2e8f0">04</text>
</g>
<g filter="url(#glow)"><text x="92" y="50" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="38" font-weight="900" letter-spacing="5" fill="url(#ink)">TECH STACK</text></g>
<g clip-path="url(#t)"><rect y="10" width="90" height="60" fill="url(#shine)" transform="skewX(-20)"><animate attributeName="x" values="60;470" dur="3.8s" repeatCount="indefinite"/></rect></g>
<text x="94" y="72" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="13" letter-spacing="2" fill="#94a3b8">// tools i build with</text>
<rect x="430" y="41" width="760" height="2" fill="url(#rule)"/>
<circle cy="42" r="4" fill="#fff" filter="url(#glow)"><animate attributeName="cx" values="430;1190" dur="3.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.85;1" dur="3.4s" repeatCount="indefinite"/></circle>
</svg>