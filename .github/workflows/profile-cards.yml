name: Update Profile Cards

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_profile_cards.py"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate hud.svg, city.svg and langstack.svg
        env:
          # Optional: add a classic PAT as the PROFILE_TOKEN secret (scope: read:user)
          # to also count private contributions. Falls back to the built-in token.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/generate_profile_cards.py

      - name: Commit changes
        run: |
          git config user.name "dev-shubh-madara"
          git config user.email "dev-shubh-madara@users.noreply.github.com"
          git add assets/hud.svg assets/city.svg assets/langstack.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh live profile cards"
            git pull --rebase origin main
            git push
          fi
